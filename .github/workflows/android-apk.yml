name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Setup Gradle 8.13 Manually
      run: |
        # Global gradle ni pakkanapetti, direct ga Gradle 8.13 bin zip ni download chestunnam
        wget https://services.gradle.org/distributions/gradle-8.13-bin.zip
        unzip -q gradle-8.13-bin.zip
        sudo mv gradle-8.13 /opt/gradle
        sudo ln -s /opt/gradle/bin/gradle /usr/bin/gradle
        
        # Wrapper files generate chesi build start chesthunnam
        gradle wrapper --gradle-version 8.13 --distribution-type bin
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DP-Cocoa-FG-Rack-debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
