name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Gradle 8.13 Directly
      run: |
        # 1. Gradle 8.13 zip ని డౌన్లోడ్ చేసి అన్‌జిప్ చేద్దాం
        wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
        unzip -q gradle-8.13-bin.zip
        
        # 2. గ్లోబల్ గ్రేడిల్ జోలికి వెళ్లకుండా, నేరుగా 8.13 పాత్ తోనే వ్రాపర్ జనరేట్ చేద్దాం
        ./gradle-8.13/bin/gradle wrapper --gradle-version 8.13 --distribution-type bin
        
        # 3. పర్మిషన్స్ ఇచ్చి APK బిల్డ్ చేద్దాం
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DP-Cocoa-FG-Rack-debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
